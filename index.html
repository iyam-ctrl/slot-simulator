<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RR07 SLOT SIMULATOR</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top, #202040 0%, #0c0c18 45%, #050509 100%);
      color: #fff;
      overflow-x: hidden;
    }

    .app {
      width: 100%;
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .logo {
      font-size: 30px;
      font-weight: 900;
      letter-spacing: 3px;
    }

    .subtitle {
      margin-top: 6px;
      color: #aaa;
      font-size: 13px;
    }

    .balance-card {
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 18px;
      padding: 18px;
      text-align: center;
      margin-bottom: 20px;
      box-shadow: 0 15px 40px rgba(0,0,0,.3);
    }

    .balance-label {
      color: #aaa;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .balance {
      margin-top: 5px;
      font-size: 34px;
      font-weight: 900;
    }

    .currency {
      color: #aaa;
      font-size: 14px;
      margin-right: 4px;
    }

    .slot-card {
      background: linear-gradient(145deg, #171727, #0c0c15);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 25px;
      padding: 20px;
      box-shadow:
        0 25px 70px rgba(0,0,0,.55),
        inset 0 1px rgba(255,255,255,.05);
    }

    .machine-title {
      text-align: center;
      font-size: 17px;
      font-weight: 800;
      margin-bottom: 15px;
      letter-spacing: 2px;
    }

    .reels {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      background: #07070d;
      padding: 15px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,.08);
    }

    .reel {
      height: 150px;
      background: linear-gradient(180deg, #252536, #11111c);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 75px;
      box-shadow:
        inset 0 0 20px rgba(0,0,0,.6),
        0 5px 15px rgba(0,0,0,.3);
      overflow: hidden;
      user-select: none;
    }

    .reel.spinning {
      animation: shake .08s infinite alternate;
    }

    @keyframes shake {
      from {
        transform: translateY(-3px);
      }
      to {
        transform: translateY(3px);
      }
    }

    .payline {
      margin: 14px 0;
      text-align: center;
      color: #777;
      font-size: 11px;
      letter-spacing: 2px;
    }

    .controls {
      margin-top: 18px;
    }

    .bet-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: rgba(255,255,255,.05);
      padding: 12px;
      border-radius: 14px;
    }

    .bet-label {
      color: #aaa;
      font-size: 13px;
    }

    .bet-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .bet-btn {
      width: 38px;
      height: 38px;
      border: none;
      border-radius: 10px;
      background: #29293b;
      color: white;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
    }

    .bet-btn:hover {
      background: #3a3a52;
    }

    .bet-value {
      min-width: 100px;
      text-align: center;
      font-weight: 800;
    }

    .spin-btn {
      width: 100%;
      margin-top: 15px;
      padding: 18px;
      border: none;
      border-radius: 16px;
      background: linear-gradient(135deg, #7c3aed, #4f46e5);
      color: white;
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 2px;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(99,102,241,.3);
      transition: .15s;
    }

    .spin-btn:hover {
      transform: translateY(-2px);
      filter: brightness(1.1);
    }

    .spin-btn:active {
      transform: scale(.98);
    }

    .spin-btn:disabled {
      opacity: .5;
      cursor: not-allowed;
      transform: none;
    }

    .message {
      min-height: 30px;
      margin-top: 15px;
      text-align: center;
      font-size: 17px;
      font-weight: 800;
    }

    .message.win {
      color: #55efc4;
    }

    .message.lose {
      color: #aaa;
    }

    .message.big-win {
      color: #ffd166;
      animation: pulse .5s infinite alternate;
    }

    @keyframes pulse {
      from {
        transform: scale(1);
      }
      to {
        transform: scale(1.05);
      }
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-top: 20px;
    }

    .info-card {
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.07);
      padding: 15px;
      border-radius: 14px;
    }

    .info-title {
      color: #888;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .info-value {
      margin-top: 5px;
      font-size: 20px;
      font-weight: 900;
    }

    .history {
      margin-top: 20px;
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.07);
      border-radius: 18px;
      padding: 16px;
    }

    .history-title {
      font-weight: 900;
      margin-bottom: 12px;
    }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 250px;
      overflow-y: auto;
    }

    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
      border-radius: 10px;
      background: rgba(0,0,0,.2);
      font-size: 13px;
    }

    .history-result {
      font-size: 22px;
      letter-spacing: 4px;
    }

    .history-win {
      color: #55efc4;
      font-weight: bold;
    }

    .history-loss {
      color: #888;
    }

    .reset-btn {
      width: 100%;
      margin-top: 15px;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.1);
      background: transparent;
      color: #aaa;
      cursor: pointer;
    }

    .reset-btn:hover {
      background: rgba(255,255,255,.05);
      color: white;
    }

    .footer {
      text-align: center;
      color: #555;
      font-size: 11px;
      margin-top: 25px;
      padding-bottom: 20px;
    }

    @media (max-width: 600px) {
      .app {
        padding: 12px;
      }

      .logo {
        font-size: 23px;
      }

      .slot-card {
        padding: 12px;
      }

      .reels {
        gap: 7px;
        padding: 10px;
      }

      .reel {
        height: 110px;
        font-size: 55px;
      }

      .bet-row {
        flex-direction: column;
        align-items: stretch;
      }

      .bet-controls {
        justify-content: center;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <header class="header">
      <div class="logo">🎰 RR07 SLOT</div>
      <div class="subtitle">virtual slot simulator v1</div>
    </header>

    <section class="balance-card">
      <div class="balance-label">saldo virtual</div>
      <div class="balance">
        <span class="currency">Rp</span>
        <span id="balance">100000</span>
      </div>
    </section>

    <section class="slot-card">

      <div class="machine-title">
        ⭐ LUCKY REELS ⭐
      </div>

      <div class="reels">

        <div class="reel" id="reel1">🍒</div>

        <div class="reel" id="reel2">🍋</div>

        <div class="reel" id="reel3">🍉</div>

      </div>

      <div class="payline">
        — — — PAYLINE — — —
      </div>

      <div class="controls">

        <div class="bet-row">

          <div class="bet-label">
            taruhan virtual
          </div>

          <div class="bet-controls">

            <button class="bet-btn" onclick="changeBet(-1)">
              −
            </button>

            <div class="bet-value" id="bet">
              Rp 1.000
            </div>

            <button class="bet-btn" onclick="changeBet(1)">
              +
            </button>

          </div>

        </div>

        <button
          class="spin-btn"
          id="spinButton"
          onclick="spin()"
        >
          🎰 SPIN
        </button>

      </div>

      <div
        class="message"
        id="message"
      ></div>

    </section>

    <div class="info-grid">

      <div class="info-card">
        <div class="info-title">
          total spin
        </div>

        <div
          class="info-value"
          id="totalSpin"
        >
          0
        </div>
      </div>

      <div class="info-card">
        <div class="info-title">
          total menang
        </div>

        <div
          class="info-value"
          id="totalWin"
        >
          Rp 0
        </div>
      </div>

    </div>

    <section class="history">

      <div class="history-title">
        📜 riwayat spin
      </div>

      <div
        class="history-list"
        id="historyList"
      >
        <div style="color:#666;text-align:center;padding:15px;">
          belum ada riwayat
        </div>
      </div>

    </section>

    <button
      class="reset-btn"
      onclick="resetGame()"
    >
      reset simulator
    </button>

    <div class="footer">
      rr07 slot simulator • virtual credits only
    </div>

  </div>

  <script>

    // ==========================================
    // GAME CONFIG
    // ==========================================

    const symbols = [
      "🍒",
      "🍋",
      "🍊",
      "🍉",
      "🍇",
      "⭐",
      "💎",
      "7️⃣"
    ];

    const bets = [
      500,
      1000,
      2500,
      5000,
      10000
    ];

    let balance = 100000;

    let betIndex = 1;

    let totalSpin = 0;

    let totalWin = 0;

    let spinning = false;


    // ==========================================
    // ELEMENTS
    // ==========================================

    const balanceEl =
      document.getElementById("balance");

    const betEl =
      document.getElementById("bet");

    const totalSpinEl =
      document.getElementById("totalSpin");

    const totalWinEl =
      document.getElementById("totalWin");

    const messageEl =
      document.getElementById("message");

    const spinButton =
      document.getElementById("spinButton");

    const historyList =
      document.getElementById("historyList");


    // ==========================================
    // FORMAT RUPIAH
    // ==========================================

    function formatRupiah(number) {

      return new Intl.NumberFormat(
        "id-ID"
      ).format(number);

    }


    // ==========================================
    // UPDATE UI
    // ==========================================

    function updateUI() {

      balanceEl.textContent =
        formatRupiah(balance);

      betEl.textContent =
        "Rp " + formatRupiah(
          bets[betIndex]
        );

      totalSpinEl.textContent =
        totalSpin;

      totalWinEl.textContent =
        "Rp " + formatRupiah(
          totalWin
        );

    }


    // ==========================================
    // CHANGE BET
    // ==========================================

    function changeBet(direction) {

      if (spinning) return;

      betIndex += direction;

      if (betIndex < 0) {
        betIndex = 0;
      }

      if (betIndex >= bets.length) {
        betIndex = bets.length - 1;
      }

      updateUI();

    }


    // ==========================================
    // RANDOM SYMBOL
    // ==========================================

    function randomSymbol() {

      return symbols[
        Math.floor(
          Math.random() * symbols.length
        )
      ];

    }


    // ==========================================
    // SPIN ANIMATION
    // ==========================================

    function animateReel(
      reel,
      duration
    ) {

      return new Promise(resolve => {

        reel.classList.add("spinning");

        const interval =
          setInterval(() => {

            reel.textContent =
              randomSymbol();

          }, 80);

        setTimeout(() => {

          clearInterval(interval);

          reel.classList.remove(
            "spinning"
          );

          reel.textContent =
            randomSymbol();

          resolve();

        }, duration);

      });

    }


    // ==========================================
    // CALCULATE WIN
    // ==========================================

    function calculateWin(
      result,
      bet
    ) {

      const [
        a,
        b,
        c
      ] = result;

      // 3 diamond
      if (
        a === "💎" &&
        b === "💎" &&
        c === "💎"
      ) {
        return bet * 25;
      }

      // 3 seven
      if (
        a === "7️⃣" &&
        b === "7️⃣" &&
        c === "7️⃣"
      ) {
        return bet * 20;
      }

      // 3 star
      if (
        a === "⭐" &&
        b === "⭐" &&
        c === "⭐"
      ) {
        return bet * 15;
      }

      // 3 same
      if (
        a === b &&
        b === c
      ) {
        return bet * 8;
      }

      // 2 same
      if (
        a === b ||
        a === c ||
        b === c
      ) {
        return bet * 2;
      }

      return 0;

    }


    // ==========================================
    // ADD HISTORY
    // ==========================================

    function addHistory(
      result,
      win,
      bet
    ) {

      const empty =
        historyList.querySelector(
          "[data-empty]"
        );

      if (empty) {
        empty.remove();
      }

      const item =
        document.createElement("div");

      item.className =
        "history-item";

      const symbolsText =
        result.join(" ");

      if (win > 0) {

        item.innerHTML = `
          <div>
            <div class="history-result">
              ${symbolsText}
            </div>
            <small>
              bet Rp ${formatRupiah(bet)}
            </small>
          </div>

          <div class="history-win">
            +Rp ${formatRupiah(win)}
          </div>
        `;

      } else {

        item.innerHTML = `
          <div>
            <div class="history-result">
              ${symbolsText}
            </div>
            <small>
              bet Rp ${formatRupiah(bet)}
            </small>
          </div>

          <div class="history-loss">
            kalah
          </div>
        `;

      }

      historyList.prepend(item);

      while (
        historyList.children.length > 20
      ) {
        historyList.lastElementChild.remove();
      }

    }


    // ==========================================
    // SPIN
    // ==========================================

    async function spin() {

      if (spinning) return;

      const bet =
        bets[betIndex];

      if (balance < bet) {

        messageEl.textContent =
          "saldo virtual lu ga cukup.";

        messageEl.className =
          "message lose";

        return;

      }

      spinning = true;

      spinButton.disabled = true;

      messageEl.textContent =
        "reels lagi muter...";

      messageEl.className =
        "message";

      balance -= bet;

      totalSpin++;

      updateUI();


      const reel1 =
        document.getElementById("reel1");

      const reel2 =
        document.getElementById("reel2");

      const reel3 =
        document.getElementById("reel3");


      // spin each reel
      const p1 =
        animateReel(
          reel1,
          900
        );

      await new Promise(
        resolve =>
          setTimeout(resolve, 180)
      );

      const p2 =
        animateReel(
          reel2,
          1200
        );

      await new Promise(
        resolve =>
          setTimeout(resolve, 180)
      );

      const p3 =
        animateReel(
          reel3,
          1500
        );


      await Promise.all([
        p1,
        p2,
        p3
      ]);


      const result = [
        reel1.textContent,
        reel2.textContent,
        reel3.textContent
      ];


      const win =
        calculateWin(
          result,
          bet
        );


      if (win > 0) {

        balance += win;

        totalWin += win;

        if (win >= bet * 8) {

          messageEl.textContent =
            "🔥 BIG WIN! +Rp " +
            formatRupiah(win);

          messageEl.className =
            "message big-win";

        } else {

          messageEl.textContent =
            "🎉 menang +Rp " +
            formatRupiah(win);

          messageEl.className =
            "message win";

        }

      } else {

        messageEl.textContent =
          "belum hoki, coba lagi 😎";

        messageEl.className =
          "message lose";

      }


      addHistory(
        result,
        win,
        bet
      );


      updateUI();


      spinning = false;

      spinButton.disabled = false;

    }


    // ==========================================
    // RESET GAME
    // ==========================================

    function resetGame() {

      if (spinning) return;

      const confirmed =
        confirm(
          "reset semua progress simulator?"
        );

      if (!confirmed) return;

      balance = 100000;

      betIndex = 1;

      totalSpin = 0;

      totalWin = 0;

      messageEl.textContent = "";

      messageEl.className =
        "message";

      historyList.innerHTML = `
        <div
          data-empty
          style="
            color:#666;
            text-align:center;
            padding:15px;
          "
        >
          belum ada riwayat
        </div>
      `;

      document.getElementById(
        "reel1"
      ).textContent = "🍒";

      document.getElementById(
        "reel2"
      ).textContent = "🍋";

      document.getElementById(
        "reel3"
      ).textContent = "🍉";

      updateUI();

    }


    // ==========================================
    // INITIALIZE
    // ==========================================

    updateUI();

  </script>

</body>
</html>
